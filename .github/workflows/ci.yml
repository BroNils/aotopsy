name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and static analysis, on Linux only: both are
  # platform-independent, and running them three times says nothing extra.
  #
  # There was no gofmt gate here for a concrete reason: 34 .go files were
  # committed with CRLF line terminators, and gofmt always writes LF, so
  # every one of them was permanently "unformatted" and the gate would have
  # been red from the day it was added. The endings are normalised and
  # pinned in .gitattributes now, which is what makes this possible -- and
  # in the process it turned up genuine formatting drift in 8 other files
  # that had gone unreported for as long as it existed.
  lint:
    name: gofmt + staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go and staticcheck are pinned together, to exact versions. staticcheck
      # reads the compiler's export data, and a release only understands the
      # formats of the Go versions it was built against: `stable` moved from
      # 1.27.1 to 1.27.2 and staticcheck@latest could no longer import the
      # standard library ("export data version 5 is greater than maximum
      # supported version 4"), so a patch release turned this job red with
      # no change in the repo. staticcheck v0.8.1 (2026.2.1) needs Go 1.26+.
      # Bump both in one commit, and check the new pair locally first.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tools)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w \$(gofmt -l ./cmd ./internal ./tools)"
            exit 1
          fi
      # go vet catches a deliberately narrow set. staticcheck covers the
      # much larger class around it -- unused results, impossible
      # conditions, misuses of the standard library.
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest = linux/amd64, macos-latest = darwin/arm64 (Apple Silicon),
        # windows-latest = windows/amd64. Ground-truth sample binaries are not
        # redistributable, so the symtab-differential / golden gates skip cleanly
        # here; this matrix proves the pure-Go build + unit tests on every platform.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # -shuffle=on because nothing here ever randomised test order, so an
      # ordering dependency between tests would pass forever and then fail
      # for whoever next added a test in the middle.
      - name: Test
        run: go test ./... -count=1 -shuffle=on -timeout 20m

  # SDK-derived tables need an external ground truth. The ordinary test matrix
  # intentionally runs without network-dependent gates, so give those gates a
  # dedicated authenticated job instead of letting AOTOPSY_TEST_SDK remain
  # unset and reporting green after every drift check skipped.
  sdk-drift:
    name: SDK drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      # Every SDK file these gates read is addressed by an exact release tag,
      # so it never changes, yet the disk cache lived in runner.temp and was
      # thrown away after each run. Each run then re-fetched hundreds of files
      # from the GitHub API, and a push plus a pull request running together
      # used up the 1000 requests/hour the job token gets ("API rate limit
      # exceeded for installation"). Keep the cache between runs. Entries
      # carry their own provenance envelope, which sdktest checks on read.
      - name: Restore SDK cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/aotopsy-sdk-cache
          key: aotopsy-sdk-${{ runner.os }}-none
          restore-keys: |
            aotopsy-sdk-${{ runner.os }}-
      - name: Verify SDK-derived tests
        env:
          AOTOPSY_TEST_SDK: '1'
          AOTOPSY_SDK_CACHE_DIR: ${{ runner.temp }}/aotopsy-sdk-cache
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          go test -p 1 -v -count=1 -timeout 30m \
            ./internal/cluster \
            ./internal/disasm \
            ./internal/evidence \
            ./internal/sdk \
            ./internal/sdktest \
            ./internal/snapshot \
            ./internal/strutil \
            ./internal/typetrack \
            ./internal/vmtables | tee "$log"
          # Sentinel PASS lines make an accidentally all-skipped SDK run fail
          # instead of reporting green after a test rename/package omission.
          grep -q -- '--- PASS: TestEvidenceSDKReferencesMatchExactSDK' "$log"
          grep -q -- '--- PASS: TestDartIdentifierAlphabetMatchesSDK' "$log"
          grep -q -- '--- PASS: TestWireDimensionsMatchSDK' "$log"
          grep -q -- '--- PASS: TestArgumentsDescriptorCountOffsetMatchesSDK' "$log"
          grep -q -- '--- PASS: TestClosureEntryPointDispMatchesSDK' "$log"
      - name: Verify generated SDK tables
        env:
          AOTOPSY_TEST_SDK: '1'
          AOTOPSY_SDK_CACHE_DIR: ${{ runner.temp }}/aotopsy-sdk-cache
          GH_TOKEN: ${{ github.token }}
        run: >-
          go run ./tools/extract_thr.go
          -check
          -check-objectstore
          -check-stubs
          -check-roots
          -check-classid-tag
          -check-runtime-entries
          -check-stub-offsets
      # Keyed by the list of cached files, so a new cache is only written when
      # the set grew, and written even if a step above failed: a run that hit
      # the quota still leaves the next one further along instead of at zero.
      - name: Fingerprint SDK cache
        id: sdkcache
        if: always()
        env:
          AOTOPSY_SDK_CACHE_DIR: ${{ runner.temp }}/aotopsy-sdk-cache
        run: |
          if [ -d "$AOTOPSY_SDK_CACHE_DIR" ]; then
            h=$(cd "$AOTOPSY_SDK_CACHE_DIR" && find . -type f | LC_ALL=C sort | sha256sum | cut -c1-16)
            echo "hash=$h" >> "$GITHUB_OUTPUT"
          fi
      - name: Save SDK cache
        if: always() && steps.sdkcache.outputs.hash != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/aotopsy-sdk-cache
          key: aotopsy-sdk-${{ runner.os }}-${{ steps.sdkcache.outputs.hash }}

  race-coverage:
    name: race + coverage (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Test (race + coverage)
        run: go test ./... -count=1 -shuffle=on -timeout 30m -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      # A floor, not a target. Coverage was measured and uploaded before,
      # and nothing ever failed when it dropped -- an artifact nobody
      # downloads is not a gate.
      #
      # Set below where the project sits, not at it. This job runs WITHOUT
      # the sample corpus (samples/ is gitignored and not redistributable),
      # so it covers only the pure-unit portion: 20.0% measured across six
      # consecutive runs, against 41.2% for a local run with the corpus.
      # One point of margin, because six identical readings say the number
      # is stable rather than noisy -- a wider gap would just be a floor
      # that never fires.
      #
      # Raise it when it is comfortably clear. Never lower it to make a red
      # build green -- that is the one move it exists to prevent.
      - name: Coverage floor
        env:
          COVERAGE_FLOOR: '19.0'
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN {
            if (t+0 < f+0) {
              printf "coverage %.1f%% is below the %.1f%% floor\n", t, f
              exit 1
            }
          }'
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
